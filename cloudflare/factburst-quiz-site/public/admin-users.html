<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Users | Factburst Quiz Admin</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin.css?v=5"><link rel="stylesheet" href="/admin-users.css?v=3"><link rel="stylesheet" href="/admin-core.css?v=2"></head><body><main class="admin-shell"><header class="admin-header"><a class="admin-brand" href="/" aria-label="Factburst Quiz home"><span class="admin-brand-mark"><img src="/brand-icon.png?v=2" alt=""></span><span>Factburst Quiz Admin</span></a><div class="admin-header-actions"><a class="button button-secondary" href="/quizzes">View site</a></div></header><div class="admin-app-layout" id="admin-app"><section class="admin-main" id="admin-content"><div class="admin-page-heading"><div><p class="eyebrow">Accounts</p><h1>Users</h1><p>Manage accounts, verification, referrals and friendships from one place.</p></div></div><div class="admin-user-stats" id="admin-user-stats"><div class="admin-user-stat"><span>Total</span><strong id="user-stat-total">—</strong></div><div class="admin-user-stat"><span>Active</span><strong id="user-stat-active">—</strong></div><div class="admin-user-stat"><span>Verified</span><strong id="user-stat-verified">—</strong></div><div class="admin-user-stat"><span>Unverified</span><strong id="user-stat-unverified">—</strong></div></div><section class="admin-panel"><div class="admin-panel-heading"><div><p class="eyebrow">Accounts</p><h2>User management</h2></div><div class="admin-user-actions"><button id="new-user" class="button button-primary" type="button">+ Add user</button><button id="refresh-users" class="button button-secondary" type="button">Refresh</button></div></div><div id="new-user-form" class="admin-new-user hidden"><form id="new-user-create-form" class="admin-form"><div class="admin-field-grid"><label>Username<input name="username" maxlength="24" required></label><label>Email<input name="email" type="email" maxlength="254" required></label><label>Password<input name="password" type="password" minlength="10" maxlength="128" required autocomplete="new-password"></label></div><label class="admin-checkbox"><input id="new-user-verify" type="checkbox"> Verify email immediately</label><div class="admin-user-actions"><button class="button button-primary" type="submit">Create user</button><button id="cancel-new-user" class="button button-secondary" type="button">Cancel</button></div></form></div><div class="admin-users-toolbar"><label class="admin-users-search">Search users<input id="admin-users-search" type="search" placeholder="Username, email or referral code…"></label><label>Status<select id="admin-users-status-filter"><option value="">All statuses</option><option value="active">Active</option><option value="suspended">Suspended</option></select></label><label>Verification<select id="admin-users-verification-filter"><option value="">All</option><option value="verified">Verified</option><option value="unverified">Unverified</option></select></label><button id="clear-user-filters" class="button button-ghost" type="button">Clear</button></div><div class="admin-users-list-heading"><div id="admin-users-status" class="admin-status"></div><span id="admin-users-count" class="admin-users-count"></span></div><div id="admin-users-list" class="admin-users-list"></div></section></section></div></main><script src="/admin-core.js?v=2"></script><script src="/admin-users.js?v=3"></script></body></html>
