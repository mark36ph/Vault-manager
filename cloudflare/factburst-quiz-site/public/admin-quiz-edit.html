<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Edit Quiz | Factburst Quiz Admin</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/admin.css?v=6"><link rel="stylesheet" href="/admin-core.css?v=2"></head><body><main class="admin-shell"><header class="admin-header"><a class="admin-brand" href="/" aria-label="Factburst Quiz home"><span class="admin-brand-mark"><img src="/brand-icon.png?v=2" alt=""></span><div>Factburst Quiz Admin</div></a><div class="admin-header-actions"><a class="button button-secondary" href="/admin/quizzes">Back to quizzes</a><button id="sign-out" class="button button-ghost" type="button">Sign out</button></div></header><div id="login-panel" class="admin-panel admin-login hidden"><p class="eyebrow">Private admin</p><h1>Manage your quizzes anywhere.</h1><p>Administrator access is protected with Google Authenticator.</p><form id="login-form" class="admin-form"><label for="admin-key">Google Authenticator code</label><input id="admin-key" name="admin-key" type="text" inputmode="numeric" maxlength="6" pattern="[0-9]{6}" autocomplete="one-time-code" required placeholder="123456"><button class="button button-primary" type="submit">Open quiz admin</button></form><p id="login-status" class="admin-status"></p></div><div class="admin-app-layout" id="admin-app"><aside class="admin-sidebar" aria-label="Admin navigation"><div class="admin-sidebar-label">Manage</div><a href="/admin">Dashboard</a><a href="/admin/quizzes" class="active">Quizzes</a><a href="/admin/social">Social</a><a href="/admin/analytics">Analytics</a><a href="/admin/settings">Settings</a></aside><section class="admin-main" id="admin-content"><div id="app-status" class="admin-status"></div><section id="editor-panel" class="admin-panel" aria-labelledby="editor-title"><div class="admin-panel-heading editor-heading"><div><p class="eyebrow">Quiz editor</p><h1 id="editor-title">Loading quiz…</h1></div><div class="editor-heading-actions"><span id="unsaved-indicator" class="admin-badge unsaved hidden">Unsaved changes</span><a class="button button-ghost" href="/admin/quizzes">Cancel</a></div></div><form id="quiz-form" class="admin-form"><div class="admin-field-grid"><label>Title<input id="quiz-title" name="title" required maxlength="160"></label><label>URL slug<input id="quiz-slug" name="slug" required maxlength="80" pattern="[a-z0-9][a-z0-9-]{0,79}"></label><label>Category<input id="quiz-category" name="category" required maxlength="80"></label><label>Status<select id="quiz-status" name="status"><option value="draft">Draft</option><option value="published">Published</option></select></label><label>Publish date &amp; time<input id="quiz-publish-at" name="publish_at" type="datetime-local"></label><label>YouTube URL<input id="quiz-youtube" name="youtube_url" type="url"></label></div><label>Description<textarea id="quiz-description" name="description" rows="4" maxlength="800"></textarea></label><div class="question-toolbar"><div><p class="eyebrow">Questions</p><h2 id="question-count">0 questions</h2></div><div class="question-toolbar-actions"><button id="expand-all-questions" class="button button-ghost" type="button">Expand all</button><button id="collapse-all-questions" class="button button-ghost" type="button">Collapse all</button><button id="add-question" class="button button-secondary" type="button">+ Add question</button></div></div><div id="questions-editor" class="questions-editor"></div><div class="editor-actions"><button id="save-quiz" class="button button-primary" type="submit">Save quiz</button><a class="button button-secondary" href="/admin/quizzes">Cancel</a></div><p id="save-status" class="admin-status"></p></form></section></section></div></div></main><script src="/admin-auth.js?v=1"></script><script src="/admin-core.js?v=5"></script><script src="/admin-quiz-edit.js?v=2"></script></body></html>
