<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>Quiz Preview | Factburst Quiz</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#061447,#071b58 55%,#25106b);color:#f5f8ff;font:16px system-ui,sans-serif;min-height:100vh}.wrap{width:min(900px,calc(100% - 28px));margin:0 auto;padding:28px 0 60px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:24px}.brand{font-weight:900;font-size:20px}.preview{font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;color:#ffd43b}.card{background:#0b1c59cc;border:1px solid #3657a6;border-radius:22px;padding:28px;box-shadow:0 24px 70px #0006}.eyebrow{color:#64d8ff;text-transform:uppercase;letter-spacing:.12em;font-weight:900;font-size:12px}.question{margin-top:24px;padding:22px;border-radius:18px;background:#10296e;border:1px solid #3456a3}.question h2{font-size:25px;line-height:1.3;margin:0 0 18px}.answers{display:grid;gap:10px}.answer{padding:14px 16px;border-radius:12px;background:#071a4c;border:1px solid #3657a6}.answer.correct{border-color:#48e0a1;box-shadow:0 0 0 1px #48e0a133}.explanation{margin-top:14px;color:#bcd0ff;line-height:1.55}.meta{display:flex;flex-wrap:wrap;gap:8px;color:#bcd0ff;font-size:14px}.pill{padding:6px 10px;border-radius:999px;background:#172e70}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}.button{display:inline-flex;text-decoration:none;border:0;border-radius:11px;padding:11px 16px;font-weight:800;cursor:pointer}.primary{background:#3bd7ff;color:#03112e}.secondary{background:#172e70;color:#fff}.error{padding:18px;border-radius:14px;background:#4a1630;color:#ffd1dd}.loading{color:#bcd0ff}.hidden{display:none}@media(max-width:600px){.card{padding:20px}.question h2{font-size:21px}.top{align-items:flex-start;flex-direction:column}}
</style>
</head>
<body><main class="wrap">
<div class="top"><div class="brand">Factburst Quiz</div><div class="preview">Admin Preview</div></div>
<section id="content" class="card"><p class="loading">Loading preview…</p></section>
</main>
<script src="/admin-preview.js?v=1"></script>
</body></html>
