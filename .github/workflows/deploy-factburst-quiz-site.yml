name: Deploy Factburst Quiz Website

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/factburst-quiz-site/**"
      - ".github/workflows/deploy-factburst-quiz-site.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factburst-quiz-site-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy quiz website
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check Cloudflare credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are required."
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Ensure quiz image R2 bucket
        shell: bash
        working-directory: cloudflare/factburst-quiz-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bucket="factburst-quiz-images"
          if ! npx --yes wrangler@4 r2 bucket info "${bucket}" >/dev/null 2>&1; then
            echo "Creating R2 bucket '${bucket}'."
            npx --yes wrangler@4 r2 bucket create "${bucket}" || npx --yes wrangler@4 r2 bucket info "${bucket}" >/dev/null
          fi

      - name: Resolve Factburst D1 database from tracker
        id: resolve
        shell: bash
        working-directory: cloudflare/factburst-quiz-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --header "Content-Type: application/json")

          scripts="$(curl --fail-with-body --silent --show-error "${auth[@]}" "${api}/workers/scripts")"
          if [[ "$(jq -r '.success // false' <<<"${scripts}")" != "true" ]]; then
            echo "Cloudflare did not return the account Workers." >&2
            jq -r '.errors[]?.message // empty' <<<"${scripts}" >&2
            exit 1
          fi

          all_matches=()
          tracker_matches=()
          while IFS= read -r script_id; do
            [[ -z "${script_id}" ]] && continue
            encoded_id="$(jq -rn --arg value "${script_id}" '$value|@uri')"
            settings="$(curl --fail-with-body --silent --show-error "${auth[@]}" "${api}/workers/scripts/${encoded_id}/settings" 2>/dev/null || true)"
            if [[ -z "${settings}" || "$(jq -r '.success // false' <<<"${settings}" 2>/dev/null)" != "true" ]]; then
              continue
            fi

            d1_id="$(jq -r '.result.bindings[]? | select(.type == "d1" and .name == "DB") | (.database_id // .id // empty)' <<<"${settings}" | head -n 1)"
            [[ -z "${d1_id}" ]] && continue
            candidate="${script_id}|${d1_id}"
            all_matches+=("${candidate}")

            has_tracker_key="$(jq -r '[.result.bindings[]? | select(.name == "TRACKER_API_KEY")] | length' <<<"${settings}")"
            if [[ "${has_tracker_key}" -gt 0 ]]; then
              tracker_matches+=("${candidate}")
            fi
          done < <(jq -r '.result[]?.id // empty' <<<"${scripts}")

          selected=""
          if [[ ${#tracker_matches[@]} -eq 1 ]]; then
            selected="${tracker_matches[0]}"
          elif [[ ${#tracker_matches[@]} -gt 1 ]]; then
            echo "More than one tracker Worker exposes TRACKER_API_KEY; the shared D1 database is ambiguous." >&2
            printf 'Tracker candidate: %s\n' "${tracker_matches[@]%%|*}" >&2
            exit 1
          fi

          if [[ -z "${selected}" ]]; then
            for candidate in "${all_matches[@]}"; do
              if [[ "${candidate%%|*}" == "go" ]]; then
                selected="${candidate}"
                break
              fi
            done
          fi

          if [[ -z "${selected}" && ${#all_matches[@]} -eq 1 ]]; then
            selected="${all_matches[0]}"
          fi

          if [[ -z "${selected}" ]]; then
            echo "Could not identify the tracker D1 database safely." >&2
            printf 'DB candidate: %s\n' "${all_matches[@]%%|*}" >&2
            exit 1
          fi

          IFS='|' read -r source_worker d1_id <<<"${selected}"
          database="$(curl --fail-with-body --silent --show-error "${auth[@]}" "${api}/d1/database/${d1_id}")"
          if [[ "$(jq -r '.success // false' <<<"${database}")" != "true" ]]; then
            echo "Cloudflare could not read the D1 database details. The token needs D1 Read permission." >&2
            jq -r '.errors[]?.message // empty' <<<"${database}" >&2
            exit 1
          fi

          d1_name="$(jq -r '.result.name // empty' <<<"${database}")"
          [[ -n "${d1_name}" ]] || { echo "The Factburst D1 database did not have a name." >&2; exit 1; }

          jq -n \
            --arg database_id "${d1_id}" \
            --arg database_name "${d1_name}" \
            --arg r2_bucket_name "factburst-quiz-images" \
            '{
              name: "factburst-quiz-site",
              main: "worker-entry.js",
              compatibility_date: "2026-08-27",
              keep_vars: true,
              workers_dev: true,
              routes: [
                {
                  pattern: "factburstquiz.com",
                  custom_domain: true
                }
              ],
              vars: {
                EMAIL_FROM: "noreply@factburstquiz.com"
              },
              assets: {
                directory: "./public",
                binding: "ASSETS",
                html_handling: "none",
                run_worker_first: [
                  "/",
                  "/index.html",
                  "/quiz",
                  "/quiz/*",
                  "/quiz.html",
                  "/quizzes",
                  "/quizzes/*",
                  "/quizzes.html",
                  "/profile",
                  "/profile.html",
                  "/leaderboard",
                  "/leaderboard.html",
                  "/terms",
                  "/terms.html",
                  "/privacy",
                  "/privacy.html",
                  "/robots.txt",
                  "/sitemap.xml",
                  "/social/*"
                ]
              },
              d1_databases: [
                {
                  binding: "DB",
                  database_name: $database_name,
                  database_id: $database_id
                }
              ],
              r2_buckets: [
                {
                  binding: "QUIZ_IMAGES",
                  bucket_name: $r2_bucket_name
                }
              ]
            }' > wrangler.ci.json

          echo "database_name=${d1_name}" >> "$GITHUB_OUTPUT"
          echo "source_worker=${source_worker}" >> "$GITHUB_OUTPUT"
          echo "Using D1 database '${d1_name}' from tracker Worker '${source_worker}' with R2 bucket 'factburst-quiz-images'."

      - name: Verify account secrets
        shell: bash
        working-directory: cloudflare/factburst-quiz-site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --header "Content-Type: application/json")
          settings="$(curl --fail-with-body --silent --show-error "${auth[@]}" "${api}/workers/scripts/factburst-quiz-site/settings")"
          if [[ "$(jq -r '.success // false' <<<"${settings}")" != "true" ]]; then
            echo "::error::Cloudflare could not read factburst-quiz-site settings."
            exit 1
          fi

          has_resend_key="$(jq -r '[.result.bindings[]? | select(.name == "RESEND_API_KEY")] | length' <<<"${settings}")"
          if [[ "${has_resend_key}" -ne 1 ]]; then
            echo "::error::RESEND_API_KEY is not configured on factburst-quiz-site."
            exit 1
          fi

          has_password_pepper="$(jq -r '[.result.bindings[]? | select(.name == "PASSWORD_PEPPER")] | length' <<<"${settings}")"
          if [[ "${has_password_pepper}" -ne 1 ]]; then
            echo "Generating a stable Factburst password pepper in Cloudflare."
            pepper="$(openssl rand -hex 32)"
            payload="$(jq -n --arg text "${pepper}" '{name:"PASSWORD_PEPPER", text:$text, type:"secret_text"}')"
            result="$(curl --fail-with-body --silent --show-error -X PUT "${auth[@]}" \
              --data "${payload}" \
              "${api}/workers/scripts/factburst-quiz-site/secrets")"
            unset pepper
            if [[ "$(jq -r '.success // false' <<<"${result}")" != "true" ]]; then
              echo "::error::Could not create PASSWORD_PEPPER on factburst-quiz-site."
              jq -r '.errors[]?.message // empty' <<<"${result}" >&2
              exit 1
            fi
          fi

          echo "Resend and password-security secrets are configured."

      - name: Deploy to Cloudflare
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/factburst-quiz-site
          wranglerVersion: "4"
          command: deploy --config wrangler.ci.json --keep-vars

      - name: Smoke test account API
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL:-https://factburst-quiz-site.factburstquiz.workers.dev}"
          base="${base%/}"
          echo "Smoke testing the direct Worker deployment URL so custom-domain bot protection cannot mask Worker health."
          for attempt in 1 2 3 4 5; do
            if response="$(curl --fail-with-body --silent --show-error --max-time 15 "${base}/api/account")"; then
              if jq -e '.authenticated == false or (.authenticated == true and (.user.username | type == "string"))' <<<"${response}" >/dev/null; then
                echo "Live account API is responding correctly."
                exit 0
              fi
            fi
            sleep 3
          done
          echo "::error::Live Factburst account API smoke test failed at the direct Worker deployment URL."
          exit 1

      - name: Smoke test homepage
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL:-https://factburst-quiz-site.factburstquiz.workers.dev}"
          base="${base%/}"
          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --max-time 15 --output "${body}" --dump-header "${headers}" --write-out '%{http_code}' "${base}/")"
          if [[ "${status}" != "200" ]]; then
            echo "::error::Homepage returned HTTP ${status}."
            cat "${headers}" >&2
            exit 1
          fi
          if ! grep -q 'data-page="home"' "${body}"; then
            echo "::error::Homepage did not return the Factburst home HTML."
            exit 1
          fi
          if ! grep -q 'https://factburstquiz.com/' "${body}"; then
            echo "::error::Homepage did not render the expected canonical site URL."
            exit 1
          fi
          echo "Homepage returned HTTP 200 with the Factburst home HTML."

      - name: Smoke test clean public routes
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL:-https://factburst-quiz-site.factburstquiz.workers.dev}"
          base="${base%/}"

          for path in profile leaderboard terms privacy; do
            headers="$(mktemp)"
            body="$(mktemp)"
            status="$(curl --silent --show-error --max-time 15 --output "${body}" --dump-header "${headers}" --write-out '%{http_code}' "${base}/${path}")"
            if [[ "${status}" != "200" ]]; then
              echo "::error::Clean public route /${path} returned HTTP ${status}."
              cat "${headers}" >&2
              exit 1
            fi
            if grep -qi '^location:' "${headers}"; then
              echo "::error::Clean public route /${path} unexpectedly redirected."
              cat "${headers}" >&2
              exit 1
            fi
            if ! grep -q "https://factburstquiz.com/${path}" "${body}"; then
              echo "::error::Clean public route /${path} did not render its clean canonical URL."
              exit 1
            fi
            if grep -Eq 'https://factburstquiz\.com/(profile|leaderboard|terms|privacy)\.html' "${body}"; then
              echo "::error::Clean public route /${path} still exposed a legacy .html canonical or internal link."
              exit 1
            fi

            legacy_headers="$(mktemp)"
            legacy_status="$(curl --silent --show-error --max-time 15 --output /dev/null --dump-header "${legacy_headers}" --write-out '%{http_code}' "${base}/${path}.html")"
            if [[ "${legacy_status}" != "301" ]]; then
              echo "::error::Legacy route /${path}.html returned HTTP ${legacy_status} instead of 301."
              cat "${legacy_headers}" >&2
              exit 1
            fi
            if ! grep -Eqi "^location: https://factburstquiz\.com/${path}\r?$" "${legacy_headers}"; then
              echo "::error::Legacy route /${path}.html did not redirect to the clean production URL."
              cat "${legacy_headers}" >&2
              exit 1
            fi
          done

          index_headers="$(mktemp)"
          index_status="$(curl --silent --show-error --max-time 15 --output /dev/null --dump-header "${index_headers}" --write-out '%{http_code}' "${base}/index.html")"
          if [[ "${index_status}" != "301" ]] || ! grep -Eqi '^location: https://factburstquiz\.com/\r?$' "${index_headers}"; then
            echo "::error::Legacy /index.html did not redirect cleanly to the homepage."
            cat "${index_headers}" >&2
            exit 1
          fi

          sitemap="$(curl --fail-with-body --silent --show-error --max-time 15 "${base}/sitemap.xml")"
          for path in leaderboard terms privacy; do
            if ! grep -q "<loc>https://factburstquiz.com/${path}</loc>" <<<"${sitemap}"; then
              echo "::error::Sitemap is missing clean /${path}."
              exit 1
            fi
          done
          if grep -Eq 'https://factburstquiz\.com/(leaderboard|terms|privacy)\.html' <<<"${sitemap}"; then
            echo "::error::Sitemap still contains legacy .html public URLs."
            exit 1
          fi
          echo "Clean public routes, legacy redirects and sitemap URLs are correct."

      - name: Smoke test clean quiz route
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          set -euo pipefail
          base="${DEPLOYMENT_URL:-https://factburst-quiz-site.factburstquiz.workers.dev}"
          base="${base%/}"

          latest="$(curl --fail-with-body --silent --show-error --max-time 15 "${base}/api/quizzes/latest")"
          slug="$(jq -r '.quiz.slug // empty' <<<"${latest}")"
          if [[ -z "${slug}" ]]; then
            echo "::error::Could not find a published latest quiz slug for the clean-route smoke test."
            exit 1
          fi

          headers="$(mktemp)"
          body="$(mktemp)"
          status="$(curl --silent --show-error --max-time 15 --output "${body}" --dump-header "${headers}" --write-out '%{http_code}' "${base}/quiz/${slug}")"
          if [[ "${status}" != "200" ]]; then
            echo "::error::Clean quiz route returned HTTP ${status} for /quiz/${slug}."
            cat "${headers}" >&2
            exit 1
          fi
          if grep -qi '^location:' "${headers}"; then
            echo "::error::Clean quiz route unexpectedly redirected for /quiz/${slug}."
            cat "${headers}" >&2
            exit 1
          fi
          if ! grep -q 'data-page="quiz"' "${body}"; then
            echo "::error::Clean quiz route did not return the quiz player HTML for /quiz/${slug}."
            exit 1
          fi
          if ! grep -q "https://factburstquiz.com/quiz/${slug}" "${body}"; then
            echo "::error::Clean quiz route did not render the expected canonical quiz URL for /quiz/${slug}."
            exit 1
          fi
          echo "Clean quiz route /quiz/${slug} returned HTTP 200 without redirecting."

      - name: Deployment summary
        if: success()
        shell: bash
        env:
          DATABASE_NAME: ${{ steps.resolve.outputs.database_name }}
          SOURCE_WORKER: ${{ steps.resolve.outputs.source_worker }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### Factburst Quiz Website deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: \`factburst-quiz-site\`" >> "$GITHUB_STEP_SUMMARY"
          echo "D1: \`${DATABASE_NAME}\` (resolved from \`${SOURCE_WORKER}\`)" >> "$GITHUB_STEP_SUMMARY"
          echo "Quiz images: \`factburst-quiz-images\` (R2)" >> "$GITHUB_STEP_SUMMARY"
          echo "Custom domain: \`factburstquiz.com\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Verification email: Resend via \`noreply@factburstquiz.com\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Password storage: PBKDF2-SHA256 + private Cloudflare pepper" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${DEPLOYMENT_URL}" ]]; then
            echo "Website: ${DEPLOYMENT_URL}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The website Worker code, static assets, D1 metadata and R2 quiz images are deployed independently of the tracker Worker." >> "$GITHUB_STEP_SUMMARY"
