name: Fix Factburst logo routing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fix-factburst-logo.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Add logo to Worker-first assets
        shell: bash
        run: |
          set -euo pipefail
          file=.github/workflows/deploy-factburst-quiz-site.yml
          if grep -q '"/brand-icon.png"' "$file"; then
            echo 'Logo route already configured.'
          else
            python - <<'PY2'
from pathlib import Path
p=Path('.github/workflows/deploy-factburst-quiz-site.yml')
s=p.read_text()
needle='                  "/privacy.html",\n                  "/robots.txt",'
replacement='                  "/privacy.html",\n                  "/brand-icon.png",\n                  "/robots.txt",'
if needle not in s:
    raise SystemExit('Could not find run_worker_first insertion point')
p.write_text(s.replace(needle,replacement,1))
PY2
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$file"
            git commit -m 'Fix dynamic Factburst logo routing'
            git push
          fi
