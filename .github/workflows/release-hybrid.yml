name: Release Windows App

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example 1.0.0"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "version.json"
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: factvault-release
  cancel-in-progress: false

jobs:
  release-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and -not [string]::IsNullOrWhiteSpace("${{ inputs.version }}")) {
            $version = "${{ inputs.version }}"
          } elseif ("${{ github.ref_type }}" -eq "tag") {
            $version = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $manifest = Get-Content version.json -Raw | ConvertFrom-Json
            $version = [string]$manifest.latest_version
          }
          if ($version -notmatch '^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$') {
            throw "Version must be SemVer, for example 1.0.0"
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.x"

      - name: Publish self-contained .NET app
        run: >-
          dotnet publish
          hybrid\FactVaultManager.Desktop\FactVaultManager.Desktop.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.version }}
          -o desktop-build\publish

      - name: Assemble installed runtime
        shell: pwsh
        run: |
          Copy-Item assets desktop-build\publish\assets -Recurse

      - name: Prepare optional Authenticode signing certificate
        id: signing
        shell: pwsh
        env:
          SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_PFX_BASE64) -or [string]::IsNullOrWhiteSpace($env:SIGNING_PFX_PASSWORD)) {
            Write-Warning "No Windows signing certificate is configured. Publishing an unsigned installer; Velopack updates remain enabled."
            "available=false" >> $env:GITHUB_OUTPUT
            exit 0
          }

          $pfx = Join-Path $env:RUNNER_TEMP "factvault-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:SIGNING_PFX_BASE64))
          } catch {
            throw "WINDOWS_SIGNING_PFX_BASE64 is not a valid base64-encoded PFX certificate."
          }
          "FACTVAULT_SIGNING_PFX=$pfx" >> $env:GITHUB_ENV
          "available=true" >> $env:GITHUB_OUTPUT

      - name: Restore pinned Velopack CLI
        run: dotnet tool restore

      - name: Download previous release metadata
        continue-on-error: true
        run: >-
          dotnet tool run vpk --
          download github
          --repoUrl https://github.com/${{ github.repository }}
          --channel win-x64-stable
          --outputDir Releases

      - name: Package Velopack release
        shell: pwsh
        env:
          SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          $packArgs = @(
            "tool", "run", "vpk", "--", "pack",
            "--packId", "FactVaultManager",
            "--packVersion", "${{ steps.version.outputs.version }}",
            "--packDir", "desktop-build\publish",
            "--mainExe", "FactVaultManager.Desktop.exe",
            "--packTitle", "Factburst Quiz Manager",
            "--packAuthors", "Factburst",
            "--runtime", "win-x64",
            "--channel", "win-x64-stable",
            "--outputDir", "Releases"
          )

          if ("${{ steps.signing.outputs.available }}" -eq "true") {
            $signParams = "/fd SHA256 /td SHA256 /tr http://timestamp.digicert.com /f `"$env:FACTVAULT_SIGNING_PFX`" /p `"$env:SIGNING_PFX_PASSWORD`""
            $packArgs += @("--signParams", $signParams)
          }

          & dotnet @packArgs
          if ($LASTEXITCODE -ne 0) { throw "Velopack packaging failed." }

      - name: Validate Windows installer output
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem Releases -File -Filter "*Setup.exe")
          if ($installers.Count -eq 0) { throw "Velopack did not produce a Windows Setup.exe installer." }
          $fullPackages = @(Get-ChildItem Releases -File -Filter "*-full.nupkg")
          if ($fullPackages.Count -eq 0) { throw "Velopack did not produce a full update package." }
          $feed = @(Get-ChildItem Releases -File -Filter "releases.win-x64-stable.json")
          if ($feed.Count -eq 0) { throw "Velopack did not produce the win-x64 stable update feed." }

      - name: Verify signed Windows installer
        if: steps.signing.outputs.available == 'true'
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction Stop |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $signtool) { throw "signtool.exe was not found on the GitHub runner." }
          $installers = @(Get-ChildItem Releases -File -Filter "*Setup.exe")
          foreach ($installer in $installers) {
            & $signtool.FullName verify /pa /v $installer.FullName
            if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $($installer.Name)." }
          }

      - name: Note unsigned Windows installer
        if: steps.signing.outputs.available != 'true'
        shell: pwsh
        run: |
          "### Windows installer published without Authenticode signing" >> $env:GITHUB_STEP_SUMMARY
          "A trusted signing certificate is not configured. The installer and Velopack update feed are still valid, but Windows SmartScreen may warn on the first install." >> $env:GITHUB_STEP_SUMMARY

      - name: Publish GitHub release
        shell: pwsh
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          dotnet tool run vpk -- upload github `
            --repoUrl https://github.com/${{ github.repository }} `
            --token $env:VPK_TOKEN `
            --publish `
            --merge `
            --releaseName "Factburst Quiz Manager $version" `
            --tag "v$version" `
            --targetCommitish "${{ github.sha }}" `
            --channel win-x64-stable `
            --outputDir Releases

      - name: Remove signing certificate
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:FACTVAULT_SIGNING_PFX) -and (Test-Path $env:FACTVAULT_SIGNING_PFX)) {
            Remove-Item $env:FACTVAULT_SIGNING_PFX -Force
          }
