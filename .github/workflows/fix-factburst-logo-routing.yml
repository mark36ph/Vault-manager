name: Fix Factburst Logo Routing

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-factburst-logo-routing.yml"

permissions:
  contents: write

jobs:
  fix:
    name: Route dynamic logo through Worker
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Add brand icon to Worker-first routes
        shell: bash
        run: |
          set -euo pipefail
          python -c "from pathlib import Path; p=Path('.github/workflows/deploy-factburst-quiz-site.yml'); s=p.read_text(); old='                  \"/privacy.html\",\\n                  \"/robots.txt\",'; new='                  \"/privacy.html\",\\n                  \"/brand-icon.png\",\\n                  \"/robots.txt\",'; assert old in s, 'Expected route block was not found'; p.write_text(s.replace(old,new,1))"

      - name: Commit deployment routing fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-factburst-quiz-site.yml
          git diff --cached --quiet && exit 0
          git commit -m "Fix dynamic Factburst logo routing"
          git push
