name: Deploy Factburst Link Tracker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/factburst-link-tracker/**"
      - ".github/workflows/deploy-factburst-link-tracker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factburst-link-tracker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tracker Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deploy skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets, then run this workflow manually once."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v6

      - name: Ensure quiz image R2 bucket
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        working-directory: cloudflare/factburst-link-tracker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          bucket="factburst-quiz-images"
          if ! npx --yes wrangler@4 r2 bucket info "${bucket}" >/dev/null 2>&1; then
            echo "Creating R2 bucket '${bucket}'."
            npx --yes wrangler@4 r2 bucket create "${bucket}" || npx --yes wrangler@4 r2 bucket info "${bucket}" >/dev/null
          fi

      - name: Resolve tracker Worker and D1 binding
        if: steps.credentials.outputs.ready == 'true'
        id: resolve
        shell: bash
        working-directory: cloudflare/factburst-link-tracker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          auth=(--header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" --header "Content-Type: application/json")

          scripts="$(curl --fail-with-body --silent --show-error "${auth[@]}" "${api}/workers/scripts")"
          if [[ "$(jq -r '.success // false' <<<"${scripts}")" != "true" ]]; then
            echo "Cloudflare did not return the account's Workers. Check the Account ID and Workers Scripts permission." >&2
            jq -r '.errors[]?.message // empty' <<<"${scripts}" >&2
            exit 1
          fi

          all_matches=()
          tracker_matches=()
          while IFS= read -r script_id; do
            [[ -z "${script_id}" ]] && continue
            encoded_id="$(jq -rn --arg value "${script_id}" '$value|@uri')"
            settings="$(curl --fail-with-body --silent --show-error "${auth[@]}" "${api}/workers/scripts/${encoded_id}/settings" 2>/dev/null || true)"
            if [[ -z "${settings}" || "$(jq -r '.success // false' <<<"${settings}" 2>/dev/null)" != "true" ]]; then
              continue
            fi

            d1_id="$(jq -r '.result.bindings[]? | select(.type == "d1" and .name == "DB") | (.database_id // .id // empty)' <<<"${settings}" | head -n 1)"
            [[ -z "${d1_id}" ]] && continue
            compatibility_date="$(jq -r '.result.compatibility_date // empty' <<<"${settings}")"
            candidate="${script_id}|${d1_id}|${compatibility_date}"
            all_matches+=("${candidate}")

            has_tracker_key="$(jq -r '[.result.bindings[]? | select(.name == "TRACKER_API_KEY")] | length' <<<"${settings}")"
            if [[ "${has_tracker_key}" -gt 0 ]]; then
              tracker_matches+=("${candidate}")
            fi
          done < <(jq -r '.result[]?.id // empty' <<<"${scripts}")

          selected=""
          if [[ ${#tracker_matches[@]} -eq 1 ]]; then
            selected="${tracker_matches[0]}"
          elif [[ ${#tracker_matches[@]} -gt 1 ]]; then
            echo "More than one Worker exposes TRACKER_API_KEY; refusing to deploy to an ambiguous target." >&2
            printf 'Tracker candidate: %s\n' "${tracker_matches[@]%%|*}" >&2
            exit 1
          fi

          if [[ -z "${selected}" ]]; then
            for candidate in "${all_matches[@]}"; do
              if [[ "${candidate%%|*}" == "go" ]]; then
                selected="${candidate}"
                break
              fi
            done
          fi

          if [[ -z "${selected}" && ${#all_matches[@]} -eq 1 ]]; then
            selected="${all_matches[0]}"
          fi

          if [[ -z "${selected}" ]]; then
            echo "Could not identify the tracker Worker safely. It must have DB plus TRACKER_API_KEY, or be named 'go'." >&2
            printf 'DB candidate: %s\n' "${all_matches[@]%%|*}" >&2
            exit 1
          fi

          IFS='|' read -r worker_name d1_id compatibility_date <<<"${selected}"
          if [[ -z "${compatibility_date}" ]]; then
            compatibility_date="2026-08-27"
          fi

          database="$(curl --fail-with-body --silent --show-error "${auth[@]}" "${api}/d1/database/${d1_id}")"
          if [[ "$(jq -r '.success // false' <<<"${database}")" != "true" ]]; then
            echo "Cloudflare did not return the bound D1 database details. The API token needs D1 Read permission." >&2
            jq -r '.errors[]?.message // empty' <<<"${database}" >&2
            exit 1
          fi

          d1_name="$(jq -r '.result.name // empty' <<<"${database}")"
          [[ -n "${d1_name}" ]] || { echo "The bound D1 database did not have a name." >&2; exit 1; }

          jq -n \
            --arg worker_name "${worker_name}" \
            --arg database_id "${d1_id}" \
            --arg database_name "${d1_name}" \
            --arg compatibility_date "${compatibility_date}" \
            --arg r2_bucket_name "factburst-quiz-images" \
            '{
              name: $worker_name,
              main: "admin-worker-entry.js",
              compatibility_date: $compatibility_date,
              keep_vars: true,
              d1_databases: [
                {
                  binding: "DB",
                  database_name: $database_name,
                  database_id: $database_id
                }
              ],
              r2_buckets: [
                {
                  binding: "QUIZ_IMAGES",
                  bucket_name: $r2_bucket_name
                }
              ]
            }' > wrangler.ci.json

          echo "worker_name=${worker_name}" >> "$GITHUB_OUTPUT"
          echo "database_id=${d1_id}" >> "$GITHUB_OUTPUT"
          echo "Resolved tracker Worker '${worker_name}' with D1 database '${d1_name}' and R2 bucket 'factburst-quiz-images'."

      - name: Deploy to Cloudflare
        if: steps.credentials.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/factburst-link-tracker
          wranglerVersion: "4"
          command: deploy --config wrangler.ci.json --keep-vars

      - name: Deployment summary
        if: steps.credentials.outputs.ready == 'true' && success()
        shell: bash
        env:
          WORKER_NAME: ${{ steps.resolve.outputs.worker_name }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### Factburst Link Tracker deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: \`${WORKER_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Quiz images: \`factburst-quiz-images\` (R2)" >> "$GITHUB_STEP_SUMMARY"
          echo "Private account administration: \`/api/site/users\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${DEPLOYMENT_URL}" ]]; then
            echo "Deployment: ${DEPLOYMENT_URL}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The tracker target was selected by TRACKER_API_KEY (with 'go' as the legacy fallback)." >> "$GITHUB_STEP_SUMMARY"
