name: Deploy Factburst Link Tracker

on:
  push:
    branches:
      - main
    paths:
      - "cloudflare/factburst-link-tracker/**"
      - ".github/workflows/deploy-factburst-link-tracker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: factburst-link-tracker-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy tracker Worker
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check Cloudflare credentials
        id: credentials
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" || -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Cloudflare deploy skipped. Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as repository Actions secrets, then run this workflow manually once."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/checkout@v6

      - name: Resolve existing D1 binding
        if: steps.credentials.outputs.ready == 'true'
        shell: bash
        working-directory: cloudflare/factburst-link-tracker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail

          settings="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/factburst-link-tracker/settings")"

          if [[ "$(jq -r '.success // false' <<<"${settings}")" != "true" ]]; then
            echo "Cloudflare did not return the current Worker settings." >&2
            jq -r '.errors[]?.message // empty' <<<"${settings}" >&2
            exit 1
          fi

          d1_id="$(jq -r '.result.bindings[]? | select(.type == "d1" and .name == "DB") | (.database_id // .id // empty)' <<<"${settings}" | head -n 1)"
          if [[ -z "${d1_id}" ]]; then
            echo "The existing factburst-link-tracker Worker does not have a D1 binding named DB." >&2
            echo "Open Cloudflare Workers & Pages → factburst-link-tracker → Settings → Bindings and confirm the D1 binding is named DB." >&2
            exit 1
          fi

          database="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            --header "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${d1_id}")"

          if [[ "$(jq -r '.success // false' <<<"${database}")" != "true" ]]; then
            echo "Cloudflare did not return the bound D1 database details. The API token needs D1 Read permission." >&2
            jq -r '.errors[]?.message // empty' <<<"${database}" >&2
            exit 1
          fi

          d1_name="$(jq -r '.result.name // empty' <<<"${database}")"
          if [[ -z "${d1_name}" ]]; then
            echo "The bound D1 database did not have a name." >&2
            exit 1
          fi

          compatibility_date="$(jq -r '.result.compatibility_date // empty' <<<"${settings}")"
          if [[ -z "${compatibility_date}" ]]; then
            compatibility_date="2026-08-27"
          fi

          jq -n \
            --arg database_id "${d1_id}" \
            --arg database_name "${d1_name}" \
            --arg compatibility_date "${compatibility_date}" \
            '{
              name: "factburst-link-tracker",
              main: "worker.js",
              compatibility_date: $compatibility_date,
              keep_vars: true,
              secrets: { required: ["TRACKER_API_KEY"] },
              d1_databases: [
                {
                  binding: "DB",
                  database_name: $database_name,
                  database_id: $database_id
                }
              ]
            }' > wrangler.ci.json

          echo "Resolved the existing DB binding and prepared a temporary Wrangler config."

      - name: Deploy to Cloudflare
        if: steps.credentials.outputs.ready == 'true'
        id: deploy
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/factburst-link-tracker
          wranglerVersion: "4"
          command: deploy --config wrangler.ci.json

      - name: Deployment summary
        if: steps.credentials.outputs.ready == 'true' && success()
        shell: bash
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment-url }}
        run: |
          echo "### Factburst Link Tracker deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Worker: \`factburst-link-tracker\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -n "${DEPLOYMENT_URL}" ]]; then
            echo "Deployment: ${DEPLOYMENT_URL}" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "The existing D1 binding and Worker secrets were preserved." >> "$GITHUB_STEP_SUMMARY"
