name: Fix Factburst ads.txt routing

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/fix-ads-txt-routing.yml"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add ads.txt to Worker-first routes
        shell: python
        run: |
          from pathlib import Path

          path = Path(".github/workflows/deploy-factburst-quiz-site.yml")
          text = path.read_text(encoding="utf-8")
          marker = '                  "/brand-icon.png",\n'
          replacement = marker + '                  "/ads.txt",\n'
          if '                  "/ads.txt",\n' in text:
              print("ads.txt routing is already present.")
          elif marker not in text:
              raise SystemExit("Could not find the brand-icon route marker.")
          else:
              path.write_text(text.replace(marker, replacement, 1), encoding="utf-8")
              print("Added /ads.txt to run_worker_first.")

      - name: Commit routing fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/deploy-factburst-quiz-site.yml .github/workflows/fix-ads-txt-routing.yml
          git rm .github/workflows/fix-ads-txt-routing.yml
          if git diff --cached --quiet; then
            echo "No changes required."
            exit 0
          fi
          git commit -m "Fix Factburst ads.txt routing"
          git push origin main
