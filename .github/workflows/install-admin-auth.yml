name: Install admin authenticator

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-admin-auth.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch worker
        shell: python
        run: |
          from pathlib import Path
          p = Path('cloudflare/factburst-quiz-site/worker.js')
          s = p.read_text()
          old = '''  if (!env.DB) return json({ error: "The quiz database is not configured yet." }, 503);\n  await ensureSchema(env.DB);\n\n  if (url.pathname === "/api/quizzes" && request.method === "GET") return listQuizzes(env.DB, url);'''
          new = '''  if (url.pathname === "/api/admin/auth/setup" && request.method === "POST") return adminAuthSetup(request, env);\n  if (url.pathname === "/api/admin/auth/login" && request.method === "POST") return adminAuthLogin(request, env);\n  if (url.pathname === "/api/admin/auth/session" && request.method === "GET") return adminAuthSession(request, env);\n  if (url.pathname === "/api/admin/auth/logout" && request.method === "POST") return adminAuthLogout();\n\n  if (!env.DB) return json({ error: "The quiz database is not configured yet." }, 503);\n  await ensureSchema(env.DB);\n\n  if (url.pathname === "/api/quizzes" && request.method === "GET") return listQuizzes(env.DB, url);'''
          if old not in s: raise SystemExit('handleApi anchor not found')
          s = s.replace(old, new, 1)

          old = '''async function requireAdmin(request, env) {\n  if (!env.SITE_ADMIN_KEY) return { response: json({ error: "Website publishing is not enabled yet." }, 503) };\n  const supplied = request.headers.get("authorization") || "";\n  if (supplied !== `Bearer ${env.SITE_ADMIN_KEY}`) return { response: json({ error: "Unauthorized." }, 401) };\n  return { ok: true };\n}\n'''
          new = '''async function requireAdmin(request, env) {\n  if (!env.SITE_ADMIN_KEY) return { response: json({ error: "Website publishing is not enabled yet." }, 503) };\n  if (await verifyAdminSession(request, env)) return { ok: true };\n  const supplied = request.headers.get("authorization") || "";\n  if (supplied !== `Bearer ${env.SITE_ADMIN_KEY}`) return { response: json({ error: "Unauthorized." }, 401) };\n  return { ok: true };\n}\n'''
          if old not in s: raise SystemExit('requireAdmin anchor not found')
          s = s.replace(old, new, 1)

          marker = 'async function listAdminQuizzes(request, env) {'
          auth = r'''const ADMIN_SESSION_COOKIE = "fb_admin_session";
const ADMIN_SESSION_SECONDS = 7 * 24 * 60 * 60;
const ADMIN_TOTP_ISSUER = "Factburst Quiz";

async function adminAuthSetup(request, env) {
  if (!env.SITE_ADMIN_KEY) return json({ error: "Website publishing is not enabled yet." }, 503);
  const supplied = request.headers.get("authorization") || "";
  if (supplied !== `Bearer ${env.SITE_ADMIN_KEY}`) return json({ error: "Unauthorized." }, 401);
  const secretBytes = await adminTotpSecretBytes(env.SITE_ADMIN_KEY);
  const secret = base32Encode(secretBytes);
  return json({ ok: true, account: "Factburst Admin", issuer: ADMIN_TOTP_ISSUER, secret });
}

async function adminAuthLogin(request, env) {
  if (!env.SITE_ADMIN_KEY) return json({ error: "Website publishing is not enabled yet." }, 503);
  const body = await readJson(request);
  const code = String(body?.code || "").replace(/\D/g, "").slice(0, 6);
  if (!/^\d{6}$/.test(code)) return json({ error: "Enter the 6-digit authenticator code." }, 400);
  const secretBytes = await adminTotpSecretBytes(env.SITE_ADMIN_KEY);
  const valid = await verifyTotpCode(secretBytes, code);
  if (!valid) return json({ error: "Authenticator code was not accepted." }, 401);
  const token = await createAdminSession(env.SITE_ADMIN_KEY);
  const headers = new Headers(JSON_HEADERS);
  headers.append("set-cookie", `${ADMIN_SESSION_COOKIE}=${token}; Max-Age=${ADMIN_SESSION_SECONDS}; Path=/; HttpOnly; Secure; SameSite=Strict`);
  return new Response(JSON.stringify({ ok: true, trusted_for_days: 7 }), { status: 200, headers });
}

async function adminAuthSession(request, env) {
  if (!env.SITE_ADMIN_KEY) return json({ error: "Website publishing is not enabled yet." }, 503);
  return (await verifyAdminSession(request, env)) ? json({ ok: true }) : json({ error: "Not signed in." }, 401);
}

function adminAuthLogout() {
  const headers = new Headers(JSON_HEADERS);
  headers.append("set-cookie", `${ADMIN_SESSION_COOKIE}=; Max-Age=0; Path=/; HttpOnly; Secure; SameSite=Strict`);
  return new Response(JSON.stringify({ ok: true }), { status: 200, headers });
}

async function adminTotpSecretBytes(siteKey) {
  const digest = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(`factburst-totp-v1:${siteKey}`));
  return new Uint8Array(digest).slice(0, 20);
}

async function verifyTotpCode(secretBytes, code) {
  const now = Math.floor(Date.now() / 1000);
  for (const offset of [-1, 0, 1]) {
    const expected = await totp(secretBytes, Math.floor(now / 30) + offset);
    if (expected === code) return true;
  }
  return false;
}

async function totp(secretBytes, counter) {
  const message = new Uint8Array(8);
  let value = BigInt(counter);
  for (let index = 7; index >= 0; index--) {
    message[index] = Number(value & 255n);
    value >>= 8n;
  }
  const key = await crypto.subtle.importKey("raw", secretBytes, { name: "HMAC", hash: "SHA-1" }, false, ["sign"]);
  const digest = new Uint8Array(await crypto.subtle.sign("HMAC", key, message));
  const offset = digest[digest.length - 1] & 15;
  const binary = ((digest[offset] & 127) << 24) | (digest[offset + 1] << 16) | (digest[offset + 2] << 8) | digest[offset + 3];
  return String(binary % 1000000).padStart(6, "0");
}

function base32Encode(bytes) {
  const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
  let bits = 0;
  let value = 0;
  let output = "";
  for (const byte of bytes) {
    value = (value << 8) | byte;
    bits += 8;
    while (bits >= 5) {
      output += alphabet[(value >>> (bits - 5)) & 31];
      bits -= 5;
    }
  }
  if (bits > 0) output += alphabet[(value << (5 - bits)) & 31];
  return output;
}

function base64Url(bytes) {
  let binary = "";
  for (const byte of bytes) binary += String.fromCharCode(byte);
  return btoa(binary).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/g, "");
}

function fromBase64Url(value) {
  const normalized = value.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((value.length + 3) % 4);
  const binary = atob(normalized);
  return Uint8Array.from(binary, char => char.charCodeAt(0));
}

async function hmacSha256(secret, text) {
  const key = await crypto.subtle.importKey("raw", new TextEncoder().encode(secret), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  return new Uint8Array(await crypto.subtle.sign("HMAC", key, new TextEncoder().encode(text)));
}

async function createAdminSession(siteKey) {
  const timestamp = Math.floor(Date.now() / 1000);
  const nonce = crypto.randomUUID();
  const payload = `${timestamp}.${nonce}`;
  const signature = base64Url(await hmacSha256(siteKey, `factburst-admin-session:${payload}`));
  return `${payload}.${signature}`;
}

async function verifyAdminSession(request, env) {
  const cookieHeader = request.headers.get("cookie") || "";
  const match = cookieHeader.split(";").map(value => value.trim()).find(value => value.startsWith(`${ADMIN_SESSION_COOKIE}=`));
  if (!match) return false;
  const token = match.slice(`${ADMIN_SESSION_COOKIE}=`.length);
  const parts = token.split(".");
  if (parts.length !== 3) return false;
  const timestamp = Number(parts[0]);
  if (!Number.isInteger(timestamp) || Math.abs(Date.now() / 1000 - timestamp) > ADMIN_SESSION_SECONDS) return false;
  const payload = `${parts[0]}.${parts[1]}`;
  const expected = await hmacSha256(env.SITE_ADMIN_KEY, `factburst-admin-session:${payload}`);
  const received = fromBase64Url(parts[2]);
  if (expected.length !== received.length) return false;
  let difference = 0;
  for (let index = 0; index < expected.length; index++) difference |= expected[index] ^ received[index];
  return difference === 0;
}

'''
          if marker not in s: raise SystemExit('listAdmin marker not found')
          s = s.replace(marker, auth + marker, 1)
          p.write_text(s)
      - name: Commit worker change and remove installer
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cloudflare/factburst-quiz-site/worker.js .github/workflows/install-admin-auth.yml
          git rm .github/workflows/install-admin-auth.yml
          git commit -m "Add seven day authenticator admin sessions" || exit 0
          git push
