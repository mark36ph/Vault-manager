name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop-build-number-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Require build bump for desktop app changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"

          if ! printf '%s\n' "$changed" | grep -q '^hybrid/FactVaultManager.Desktop/'; then
            echo "No desktop app changes detected; build bump is not required."
            exit 0
          fi

          build_info='hybrid/FactVaultManager.Desktop/MainShellWindow.BuildInfo.cs'
          if ! printf '%s\n' "$changed" | grep -qx "$build_info"; then
            echo "Desktop app code changed but $build_info was not updated. Bump CurrentBuildNumber."
            exit 1
          fi
          if ! printf '%s\n' "$changed" | grep -qx 'version.json'; then
            echo "Desktop app code changed but version.json was not updated. Keep its build number in sync."
            exit 1
          fi

          base_build="$(git show "$BASE_SHA:$build_info" | sed -n 's/.*CurrentBuildNumber = \([0-9][0-9]*\).*/\1/p' | head -n 1)"
          head_build="$(git show "$HEAD_SHA:$build_info" | sed -n 's/.*CurrentBuildNumber = \([0-9][0-9]*\).*/\1/p' | head -n 1)"
          version_build="$(git show "$HEAD_SHA:version.json" | python -c 'import json,sys; print(json.load(sys.stdin)["build"])')"

          if [[ -z "$base_build" || -z "$head_build" ]]; then
            echo "Could not read desktop build numbers."
            exit 1
          fi
          if (( head_build <= base_build )); then
            echo "Desktop build number must increase: base=$base_build head=$head_build."
            exit 1
          fi
          if [[ "$version_build" != "$head_build" ]]; then
            echo "version.json build ($version_build) must match CurrentBuildNumber ($head_build)."
            exit 1
          fi

          echo "Desktop build bump verified: $base_build -> $head_build."

  dotnet-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore hybrid\FactVaultManager.Desktop.Tests\FactVaultManager.Desktop.Tests.csproj

      - name: Run C# tests
        run: >-
          dotnet test
          hybrid\FactVaultManager.Desktop.Tests\FactVaultManager.Desktop.Tests.csproj
          -c Release
          --no-restore
          --logger "trx;LogFileName=factvault-tests.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dotnet-test-results
          path: hybrid/FactVaultManager.Desktop.Tests/TestResults
          if-no-files-found: ignore

  website-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check cloudflare/factburst-quiz-site/worker.js
          node --check cloudflare/factburst-quiz-site/worker-entry.js
          node --check cloudflare/factburst-quiz-site/site-seo.js
          node --check cloudflare/factburst-quiz-site/social-card.js
          node --check cloudflare/factburst-quiz-site/accounts.js
          node --check cloudflare/factburst-quiz-site/account-auth.js
          node --check cloudflare/factburst-quiz-site/account-schema.js
          node --check cloudflare/factburst-quiz-site/account-access.js
          node --check cloudflare/factburst-quiz-site/account-policy.js
          node --check cloudflare/factburst-quiz-site/account-profile.js
          node --check cloudflare/factburst-quiz-site/account-leaderboards.js
          node --check cloudflare/factburst-quiz-site/account-friends.js
          node --check cloudflare/factburst-quiz-site/account-challenges.js
          node --check cloudflare/factburst-quiz-site/account-comments.js
          node --check cloudflare/factburst-quiz-site/account-engagement.js
          node --check cloudflare/factburst-quiz-site/site-controls.js
          node --check cloudflare/factburst-quiz-site/guest-score.js
          node --check cloudflare/factburst-quiz-site/site-ads.js
          node --check cloudflare/factburst-quiz-site/resend-email.js
          node --check cloudflare/factburst-quiz-site/public/app.js
          node --check cloudflare/factburst-quiz-site/public/landing.js
          node --check cloudflare/factburst-quiz-site/public/growth.js
          node --check cloudflare/factburst-quiz-site/public/engagement.js
          node --check cloudflare/factburst-quiz-site/public/account-ui.js
          node --check cloudflare/factburst-quiz-site/public/account-ui-v2.js
          node --check cloudflare/factburst-quiz-site/public/profile.js
          node --check cloudflare/factburst-quiz-site/public/profile-link.js
          node --check cloudflare/factburst-quiz-site/public/challenge-ui.js
          node --check cloudflare/factburst-quiz-site/public/comments.js
          node --check cloudflare/factburst-quiz-site/public/comments-v2.js
          node --check cloudflare/factburst-quiz-site/public/ads.js
          node --check cloudflare/factburst-quiz-site/public/site-status.js
          node --check cloudflare/factburst-link-tracker/worker.js
          node --check cloudflare/factburst-link-tracker/admin-worker-entry.js
          node --check cloudflare/factburst-link-tracker/site-user-admin.js
          node --check cloudflare/factburst-link-tracker/site-user-friends-admin.js
          node --check cloudflare/factburst-link-tracker/site-ad-admin.js
          node --check cloudflare/factburst-link-tracker/site-quiz-admin.js
          node --check cloudflare/factburst-link-tracker/site-question-report-admin.js

      - name: Run website account and SEO tests
        run: >-
          node --test
          cloudflare/factburst-quiz-site/account-auth.test.mjs
          cloudflare/factburst-quiz-site/accounts.test.mjs
          cloudflare/factburst-quiz-site/build66-features.test.mjs
          cloudflare/factburst-quiz-site/maintenance-and-reports.test.mjs
          cloudflare/factburst-quiz-site/resend-email.test.mjs
          cloudflare/factburst-quiz-site/site-seo.test.mjs

      - name: Validate quiz website Worker bundle
        working-directory: cloudflare/factburst-quiz-site
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run

      - name: Validate tracker admin Worker bundle
        working-directory: cloudflare/factburst-link-tracker
        run: npx --yes wrangler@4 deploy admin-worker-entry.js --name factburst-link-tracker-admin-check --compatibility-date 2026-08-27 --dry-run --outdir .wrangler-dry-run
