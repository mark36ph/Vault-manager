name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore hybrid\FactVaultManager.Desktop.Tests\FactVaultManager.Desktop.Tests.csproj

      - name: Run C# tests
        run: >-
          dotnet test
          hybrid\FactVaultManager.Desktop.Tests\FactVaultManager.Desktop.Tests.csproj
          -c Release
          --no-restore
          --logger "trx;LogFileName=factvault-tests.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dotnet-test-results
          path: hybrid/FactVaultManager.Desktop.Tests/TestResults
          if-no-files-found: ignore
