name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet-test:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore hybrid\FactVaultManager.Desktop.Tests\FactVaultManager.Desktop.Tests.csproj

      - name: Run C# tests
        run: >-
          dotnet test
          hybrid\FactVaultManager.Desktop.Tests\FactVaultManager.Desktop.Tests.csproj
          -c Release
          --no-restore
          --logger "trx;LogFileName=factvault-tests.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: hybrid/FactVaultManager.Desktop.Tests/TestResults
          if-no-files-found: ignore
