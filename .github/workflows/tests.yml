name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dotnet-test:
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore hybrid\FactVaultManager.Desktop.Tests\FactVaultManager.Desktop.Tests.csproj

      - name: Run C# tests
        run: >-
          dotnet test
          hybrid\FactVaultManager.Desktop.Tests\FactVaultManager.Desktop.Tests.csproj
          -c Release
          --no-restore
          --logger "trx;LogFileName=factvault-tests.trx"
          --collect:"XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: dotnet-test-results
          path: hybrid/FactVaultManager.Desktop.Tests/TestResults
          if-no-files-found: ignore

  website-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Check JavaScript syntax
        run: |
          node --check cloudflare/factburst-quiz-site/worker.js
          node --check cloudflare/factburst-quiz-site/public/app.js
          node --check cloudflare/factburst-link-tracker/worker.js
          node --check cloudflare/factburst-link-tracker/site-quiz-admin.js

      - name: Validate Cloudflare Worker bundle
        working-directory: cloudflare/factburst-quiz-site
        run: npx --yes wrangler@4 deploy --dry-run --outdir .wrangler-dry-run
